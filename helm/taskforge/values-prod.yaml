replicaCount: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
api:
  env:
    APP_ENV: production
    APP_DEBUG: "false"
    WEB_CONCURRENCY: "4"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
ingress:
  hosts:
    - host: api.taskforge.example
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: taskforge-tls
      hosts:
        - api.taskforge.example
networkPolicy:
  enabled: true
backup:
  enabled: true
  s3:
    enabled: true
