apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskforge.fullname" . }}
  labels:
    {{- include "taskforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  INTERNAL_API_KEY: {{ .Values.secrets.internalApiKey | quote }}
  MARIADB_PASSWORD: {{ .Values.mariadb.auth.password | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.mariadb.auth.rootPassword | quote }}
  SMTP_USER: {{ .Values.config.smtpUser | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.config.smtpPassword | default "" | quote }}
  DATABASE_URL: mysql+pymysql://{{ .Values.mariadb.auth.username }}:{{ .Values.mariadb.auth.password }}@{{ include "taskforge.mariadbHost" . }}:3306/{{ .Values.mariadb.auth.database }}
