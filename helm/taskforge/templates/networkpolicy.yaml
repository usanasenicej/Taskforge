{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskforge.fullname" . }}
  labels:
    {{- include "taskforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskforge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
  egress:
    - {}
{{- end }}
