apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskforge
  labels:
    app.kubernetes.io/name: taskforge
spec:
  groups:
    - name: taskforge.api
      rules:
        - alert: TaskForgeHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="taskforge",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="taskforge"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: TaskForge 5xx rate is above 5%
        - alert: TaskForgeQueueBacklog
          expr: taskforge_queue_length > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: RQ queue length is high
        - alert: TaskForgeApiDown
          expr: up{job="taskforge"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: TaskForge API scrape target is down
