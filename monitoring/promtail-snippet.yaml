# Example scrape for Loki. Mount as a Promtail extra scrape config.
scrape_configs:
  - job_name: taskforge
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: taskforge
        action: keep
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            logger: logger
